name: Build macOS

on:
  push:
    branches: [main]
    tags: ["v*", "[0-9]*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "已由用户确定并推送的版本 tag"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: build-macos-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  MACOSX_DEPLOYMENT_TARGET: "13.0"
  FSTODO_RELEASE_TAG: ${{ inputs.tag || (github.ref_type == 'tag' && github.ref_name) || '' }}

jobs:
  frontend-tests:
    name: Frontend tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Test frontend
        working-directory: frontend
        run: npm test

  backend-tests:
    name: macOS backend tests
    runs-on: macos-15
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Install Rust
        run: |
          rustup toolchain install 1.88.0 --profile minimal
          rustup default 1.88.0
      - name: Cache backend test dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: macos-15-backend-tests
          workspaces: backend -> target
          env-vars: MACOSX_DEPLOYMENT_TARGET
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Test backend
        working-directory: backend
        run: cargo test --locked
      - name: Test token persistence with an isolated Keychain
        working-directory: backend
        run: |
          original_keychain=$(security default-keychain -d user | sed 's/^ *"//; s/"$//')
          test_keychain="$RUNNER_TEMP/fstodo-test.keychain-db"
          keychain_password=$(uuidgen)
          cleanup() {
            security default-keychain -d user -s "$original_keychain"
            security delete-keychain "$test_keychain"
          }
          trap cleanup EXIT
          security create-keychain -p "$keychain_password" "$test_keychain"
          security unlock-keychain -p "$keychain_password" "$test_keychain"
          security default-keychain -d user -s "$test_keychain"
          cargo test --locked encrypted_token_survives_reopen_and_overrides_external_credentials -- --ignored

  build:
    name: macOS universal DMG
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Validate tag and generate release notes
        if: env.FSTODO_RELEASE_TAG != ''
        id: notes
        run: node frontend/scripts/release-notes.mjs --output artifacts/release --github-output "$GITHUB_OUTPUT"
      - name: Use generated notes for build
        if: env.FSTODO_RELEASE_TAG != ''
        run: echo "FSTODO_RELEASE_NOTES_FILE=$GITHUB_WORKSPACE/artifacts/release/release.json" >> "$GITHUB_ENV"
      - name: Install Rust
        run: |
          rustup toolchain install 1.88.0 --profile minimal --target aarch64-apple-darwin,x86_64-apple-darwin
          rustup default 1.88.0
      - name: Cache universal release dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: macos-15-desktop-universal
          workspaces: frontend/src-tauri -> target
          env-vars: MACOSX_DEPLOYMENT_TARGET
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Warm both release architecture caches on main
        if: env.FSTODO_RELEASE_TAG == ''
        run: |
          npm --prefix frontend run build
          for target in aarch64-apple-darwin x86_64-apple-darwin; do
            cargo build --manifest-path frontend/src-tauri/Cargo.toml --release --locked --bins --features tauri/custom-protocol --target "$target"
          done
      - name: Build universal app and DMG
        if: env.FSTODO_RELEASE_TAG != ''
        working-directory: frontend
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run build:macos
      - name: Verify architectures and ad-hoc signature
        if: env.FSTODO_RELEASE_TAG != ''
        run: |
          app=frontend/src-tauri/target/universal-apple-darwin/release/bundle/macos/FSTODO.app
          lipo "$app/Contents/MacOS/fstodo-desktop" -verify_arch arm64 x86_64
          codesign --verify --deep --strict --verbose=2 "$app"
      - name: Collect DMG, release notes and optional signed updater archive
        if: env.FSTODO_RELEASE_TAG != ''
        env:
          UPDATER_SIGNING_ENABLED: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
        run: |
          mkdir -p artifacts/packages
          cp frontend/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg artifacts/packages/
          cp artifacts/release/RELEASE_NOTES.md artifacts/packages/
          cp artifacts/release/release.json artifacts/packages/
          if [ "$UPDATER_SIGNING_ENABLED" = true ]; then
            cp frontend/src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz artifacts/packages/
            cp frontend/src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz.sig artifacts/packages/
          else
            echo "未配置 updater 私钥：仅交付手动安装 DMG，没有自动更新包。"
          fi
      - name: Upload DMG and release notes
        if: env.FSTODO_RELEASE_TAG != ''
        uses: actions/upload-artifact@v7
        with:
          name: FSTODO-${{ steps.notes.outputs.version }}-macos-universal
          path: artifacts/packages/*
          if-no-files-found: error
          retention-days: 14
